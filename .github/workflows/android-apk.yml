



name: Build Android APK

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - "mqane-professional-pages-independent-2026"
  push:
    branches:
      - "main"
      - "ui-professional-sheep-icon"
      - "integrated-farm-management"
      - "scientific-sheep-guide"
      - "simple-navigation-redesign"
      - "animal-profile-cards"
      - "mqane-inspired-interface"
      - "mqane-comprehensive-independent"
      - "mqane-vaccination-independent-2026"
      - "mqane-professional-pages-independent-2026"
      - "mqane-exact-independent-copy-2026"
      - "mqane-auto-calendar-independent-2026"
      - "mawashi-vaccination-standalone-20261106"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o MurabbiAlghanm_Rebuilt_Source.zip -d .

      - name: Apply updated Arabic dashboard and animal profile database
        run: |
          cp MainActivity.txt app/src/main/java/dz/murabbi/alghanm/MainActivity.kt
          cp FarmDatabase.txt app/src/main/java/dz/murabbi/alghanm/data/FarmDatabase.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application', 1)
          receiver = '<receiver android:name="dz.murabbi.alghanm.VaccineReminderReceiver" android:enabled="true" android:exported="false" />'
          if "VaccineReminderReceiver" not in s:
              s = s.replace("</application>", "        " + receiver + "\n    </application>", 1)
          p.write_text(s)
          PY

      - name: Add sheep app icon
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_sheep.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#126B37" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F6DCA8" android:pathData="M18,49 C7,37 12,27 24,32 C28,20 40,21 45,28 C53,16 66,20 68,29 C81,22 91,31 87,41 C100,46 96,59 87,62 C91,75 80,83 70,78 C62,91 48,88 45,80 C31,88 20,79 24,68 C12,66 10,55 18,49z"/>
              <path android:fillColor="#F3C7A7" android:pathData="M18,45 C3,27 7,20 23,31 L34,44 L28,58z M90,45 C105,27 101,20 85,31 L74,44 L80,58z"/>
              <path android:fillColor="#FFF4DD" android:pathData="M30,42 C30,31 43,29 51,34 C60,27 77,34 78,47 C82,64 70,79 54,81 C37,78 26,61 30,42z"/>
              <path android:fillColor="#E9B98F" android:pathData="M43,58 C43,52 49,49 54,52 C60,49 66,53 66,59 C66,67 59,72 54,72 C48,71 43,66 43,58z"/>
              <path android:fillColor="#49352B" android:pathData="M39,48a3,3 0,1 0,6 0a3,3 0,1 0,-6 0 M63,48a3,3 0,1 0,6 0a3,3 0,1 0,-6 0"/>
              <path android:fillColor="#B66E61" android:pathData="M50,60 Q54,56 58,60 Q57,65 54,65 Q50,64 50,60z"/>
              <path android:fillColor="#D9A86D" android:pathData="M49,77 Q54,82 59,77 L58,84 Q54,89 50,84z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          match = re.search(r'<application\\b[^>]*>', s)
          if not match:
              raise SystemExit("Could not locate application element in AndroidManifest.xml")
          tag = match.group(0)
          def set_android_attr(tag, name, value):
              pattern = r'\\sandroid:' + re.escape(name) + r'="[^"]*"'
              if re.search(pattern, tag):
                  return re.sub(pattern, ' android:' + name + '="' + value + '"', tag, count=1)
              return tag[:-1] + ' android:' + name + '="' + value + '">'
          tag = set_android_attr(tag, "icon", "@drawable/ic_sheep")
          tag = set_android_attr(tag, "label", "مواشي")
          s = s[:match.start()] + tag + s[match.end():]
          import xml.etree.ElementTree as ET
          ET.fromstring(s)
          p.write_text(s)
          print("Validated AndroidManifest.xml; Mawashi icon and label configured")
          PY

      - name: Force separate test application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          branch = os.environ.get("GITHUB_REF_NAME")
          expected = ("dz.murabbi.alghanm.mawashi20261106"
                      if branch == "mawashi-vaccination-standalone-20261106"
                      else "dz.murabbi.alghanm.calendarstandalone20261106"
                      if branch == "mqane-auto-calendar-independent-2026"
                      else "dz.murabbi.alghanm.independent2026"
                      if branch == "mqane-exact-independent-copy-2026"
                      else "dz.murabbi.alghanm.professional2026")

          s, count = re.subn(
              r'(?m)^(\s*applicationId\s*=\s*)["\'][^"\']+["\']',
              lambda m: m.group(1) + '"' + expected + '"',
              s
          )

          if count != 1:
              raise SystemExit("ERROR: Could not set applicationId exactly once")

          p.write_text(s)
          print(f"TEST APPLICATION ID: {expected}")
          PY

          grep -n applicationId app/build.gradle.kts

          # Verify the Gradle configuration resolves to the isolated package before building.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          s = Path("app/build.gradle.kts").read_text()
          m = re.search(r'applicationId\s*=\s*"([^"]+)"', s)
          branch = os.environ.get("GITHUB_REF_NAME")
          expected = ("dz.murabbi.alghanm.mawashi20261106"
                      if branch == "mawashi-vaccination-standalone-20261106"
                      else "dz.murabbi.alghanm.calendarstandalone20261106"
                      if branch == "mqane-auto-calendar-independent-2026"
                      else "dz.murabbi.alghanm.independent2026"
                      if branch == "mqane-exact-independent-copy-2026"
                      else "dz.murabbi.alghanm.professional2026")
          if not m or m.group(1) != expected:
              raise SystemExit(f"Package ID verification failed: {m.group(1) if m else 'missing'}")
          print(f"VERIFIED ISOLATED PACKAGE: {m.group(1)}")
          PY

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify standalone package and isolated database
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "ERROR: Android build-tools aapt was not found"
            exit 1
          fi
          ACTUAL_PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          EXPECTED_PACKAGE="dz.murabbi.alghanm.mawashi20261106"
          if [ "$ACTUAL_PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "ERROR: APK package is $ACTUAL_PACKAGE, expected $EXPECTED_PACKAGE"
            exit 1
          fi
          grep -q '"mawashi_standalone20261106.db"' app/src/main/java/dz/murabbi/alghanm/data/FarmDatabase.kt
          echo "VERIFIED APK PACKAGE: $ACTUAL_PACKAGE"
          echo "VERIFIED DATABASE: mawashi_standalone20261106.db"

      - uses: actions/upload-artifact@v4
        with:
          name: Mawashi-Standalone-20261106-APK
          path: app/build/outputs/apk/debug/app-debug.apk

# Rebuild the professional sheep-icon test APK
