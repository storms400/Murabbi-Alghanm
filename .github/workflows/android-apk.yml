


name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o MurabbiAlghanm_Rebuilt_Source.zip -d .

      - name: Force separate test application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s, count = re.subn(
              r'(?m)^(\s*applicationId\s*=\s*)["\'][^"\']+["\']',
              r'\1"dz.murabbi.alghanm.test2"',
              s
          )

          if count != 1:
              raise SystemExit("ERROR: Could not set applicationId exactly once")

          p.write_text(s)
          print("TEST APPLICATION ID: dz.murabbi.alghanm.test2")
          PY

          grep -n applicationId app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MurabbiAlghanm-Test2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
