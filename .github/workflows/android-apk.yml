
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o MurabbiAlghanm_Rebuilt_Source.zip -d .

      - name: Set test application ID
        run: sed -i 's/applicationId = "dz.murabbi.alghanm"/applicationId = "dz.murabbi.alghanm.test"/' app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MurabbiAlghanm-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk

